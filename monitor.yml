name: market-monitor
on:
  schedule:
    - cron: "5 * * * *"   # 每小時第 5 分執行 (UTC)
  workflow_dispatch: {}    # 也可手動觸發測試
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run monitor
        run: python monitor.py
      - name: Commit signals
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "signals $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push
